name: pull-repos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-repos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        repo:
          - openai/codex
          - NousResearch/hermes-agent
          - openclaw/openclaw
          - can1357/oh-my-pi
          - microsoft/generative-ai-for-beginners
          - torvalds/linux
          - JetBrains/intellij-community
          - raspberrypi/linux
          - google/material-design-icons
          - roboflow/supervision
          - remotion-dev/remotion
          - microsoft/ai-agents-for-beginners
          - danielmiessler/SecLists
          - nexu-io/open-design
          - commaai/openpilot
          - microsoft/TypeScript
          - vercel/next.js
          - supabase/supabase
          - openbq-org/OpenBB
          - metabase/metabase
          - microsoft/ML-For-Beginners
          - twentyhq/twenty
          - microsoft/Web-Dev-For-Beginners
          - grafana/grafana
          - PaddlePaddle/PaddleOCR
          - godotengine/godot
          - diegosouzapw/OmniRoute
          - elastic/elasticsearch
          - mrdoob/three.js
          - nodejs/node
          - pytorch/pytorch
          - langflow-ai/langflow
          - facebook/docusaurus
          - tldraw/tldraw
    steps:
      - name: Clone ${{ matrix.repo }} (shallow)
        run: |
          dir="${GITHUB_REPO##*/}"
          start=$(date +%s%3N)
          git clone --depth 1 "https://github.com/$GITHUB_REPO" "$dir"
          elapsed=$(( $(date +%s%3N) - start ))
          {
            echo "## $GITHUB_REPO"
            echo "- commit: \`$(git -C "$dir" rev-parse HEAD)\`"
            echo "- subject: $(git -C "$dir" log -1 --pretty=%s)"
            echo "- size: $(du -sh "$dir" | cut -f1)"
            echo "- tracked files: $(git -C "$dir" ls-files | wc -l)"
            echo "- shallow: $(git -C "$dir" rev-parse --is-shallow-repository)"
            echo "- clone time: ${elapsed}ms"
            echo "- disk free after: $(df -h --output=avail / | tail -1 | tr -d ' ')"
          } | tee "report-$dir.txt" >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_REPO: ${{ matrix.repo }}

      - uses: actions/upload-artifact@v7
        with:
          name: clone-report-${{ strategy.job-index }}
          path: report-*.txt
          retention-days: 1
